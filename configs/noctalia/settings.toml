[accessibility]
ui_scale = 1.25

[audio]
enable_overdrive = true

[bar.default]
border = "primary"
border_width = 2
center = [
    "media",
    "spacer",
    "clock",
    "notifications",
    "spacer",
    "audio_visualizer",
]
concave_edge_corners = false
end = ["group:g1", "group:g2", "group:g3", "session"]
font_family = "JetBrainsMono Nerd Font"
margin_edge = 8
margin_ends = 8
radius = 8
scale = 1.5
start = ["workspaces", "tray", "active_window"]
thickness = 42

[[bar.default.capsule_group]]
id = "g1"
members = ["network", "bluetooth"]
opacity = 0.0

[[bar.default.capsule_group]]
id = "g2"
members = ["output_volume", "input_volume", "brightness"]
opacity = 0.0

[[bar.default.capsule_group]]
id = "g3"
members = ["cpu", "ram", "battery"]
opacity = 0.0

[bar.default.dead_zone.actions]
left = "panel-toggle control-center home"
right = "panel-toggle noctalia/wallhaven:browser"
scroll_down = "workspace-switch next"
scroll_up = "workspace-switch prev"

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[idle]
pre_action_fade_seconds = 30

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
locked_timeout = 30
timeout = 330

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[notification]
position = "top_center"

[osd]
offset_y = 4
position = "bottom_center"
position_vertical = "center_right"

[plugin_settings."noctalia/kaomoji"]
notify_on_copy = false

[plugins]
enabled = ["noctalia/kaomoji", "noctalia/wallhaven"]

[shell]
polkit_agent = true

[shell.launcher]
categories = false

[shell.screen_corners]
enabled = true
size = 16

[shell.screenshot]
directory = "/home/frostbun/Pictures/Screenshots"

[theme]
builtin = "Tokyo-Night"

[theme.templates]
builtin_ids = ["btop", "cava", "hyprland", "kitty"]
community_ids = [
    "opencode",
    "discord",
    "blender",
    "darktable",
    "gimp",
    "vscode",
    "fastfetch",
    "obs",
    "bat",
    "lazygit",
    "yazi",
]

[wallpaper]
directory = "/home/frostbun/Pictures/Wallpapers"

[wallpaper.default]
path = "/home/frostbun/.config/background"

[wallpaper.last]
path = "/home/frostbun/.config/background"

[widget.audio_visualizer]
centered = false
color_2 = "secondary"
width = 64

[widget.bluetooth]
show_label = true

[widget.clock]
anchor = true
format = "{:%a %b %d %I:%M:%S %p}"

[widget.cpu]
visualization = "none"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_vpn_label = true

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.tray]
drawer = true
