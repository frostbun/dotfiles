[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 16.0

[cursor]
style = { shape = "Beam", blinking = "Off" }

[window]
decorations = "None"
dynamic_padding = true
opacity = 0.95

[window.dimensions]
columns = 128
lines = 32

[window.padding]
x = 4
y = 4

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
